<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCS Notulist Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
        <h1 class="text-2xl font-bold text-blue-900 mb-2">🎙️ RCS Notulist Pro</h1>
        <p id="statusText" class="text-gray-500 mb-6">Systeem gereed</p>

        <div id="timer" class="text-4xl font-mono font-bold text-gray-800 mb-8">00:00:00</div>

        <button id="recordBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95">
            Start Vergadering
        </button>

        <div id="log" class="mt-6 text-left text-xs text-gray-400 max-h-48 overflow-y-auto p-2 border-t"></div>
    </div>

    <script>
        // Jouw specifieke Google Web App URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw4KWYtV8bDMYjhLzNpKXDdWHYfom6f_opZJQjmk6klhhKO5P4MUqVenIf_4RSoeIEwfg/exec";

        let mediaRecorder;
        let fullTranscript = "";
        let isRecording = false;
        let timerInterval;
        let seconds = 0;

        const recordBtn = document.getElementById('recordBtn');
        const statusText = document.getElementById('statusText');
        const timerDisplay = document.getElementById('timer');
        const log = document.getElementById('log');

        function addLog(msg) {
            const entry = document.createElement('div');
            entry.className = "py-1 border-b border-gray-50";
            entry.textContent = `${new Date().toLocaleTimeString()} - ${msg}`;
            log.prepend(entry);
        }

        async function callGAS(action, payload) {
            try {
                const body = JSON.stringify({ action: action, ...payload });
                const response = await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    body: body,
                    mode: 'no-cors' // Nodig voor sommige browser beveiligingen
                });
                
                // Omdat we 'no-cors' gebruiken, kunnen we de response niet direct lezen
                // We gaan ervan uit dat het script op de achtergrond zijn werk doet.
                return "Verzonden..."; 
            } catch (err) {
                // Als no-cors niet werkt, proberen we de normale weg
                const body = JSON.stringify({ action: action, ...payload });
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: body });
                const res = await response.json();
                return res.data;
            }
        }

        recordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    // Bepaal beste audio-formaat voor deze browser
                    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
                                     ? 'audio/webm;codecs=opus' 
                                     : 'audio/webm';
                    
                    mediaRecorder = new MediaRecorder(stream, { mimeType });
                    
                    mediaRecorder.ondataavailable = async (event) => {
                        if (event.data.size > 1000) {
                            const reader = new FileReader();
                            reader.readAsDataURL(event.data);
                            reader.onloadend = async () => {
                                const base64 = reader.result.split(',')[1];
                                addLog("Segment naar AI sturen...");
                                
                                // We sturen het naar Google
                                const text = await callGAS("processAudio", { base64: base64 });
                                if (text && text !== "Verzonden...") {
                                    fullTranscript += text + " ";
                                    addLog("Gezegd: " + text.substring(0, 30) + "...");
                                } else {
                                    addLog("Bezig met verwerken...");
                                }
                            };
                        }
                    };

                    mediaRecorder.start(10000); // Elke 10 seconden een stukje audio verwerken
                    isRecording = true;
                    recordBtn.textContent = "Stop & Genereer Notulen";
                    recordBtn.classList.replace('bg-blue-700', 'bg-red-600');
                    statusText.textContent = "Systeem luistert mee...";
                    
                    timerInterval = setInterval(() => {
                        seconds++;
                        const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
                        const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                        const s = (seconds % 60).toString().padStart(2, '0');
                        timerDisplay.textContent = `${h}:${m}:${s}`;
                    }, 1000);

                } catch (err) {
                    addLog("Microfoon fout: " + err.message);
                    alert("Kan microfoon niet starten. Controleer je instellingen.");
                }
            } else {
                stopRecording();
            }
        };

        async function stopRecording() {
            isRecording = false;
            clearInterval(timerInterval);
            mediaRecorder.stop();
            
            recordBtn.disabled = true;
            recordBtn.textContent = "Verwerken...";
            recordBtn.classList.replace('bg-red-600', 'bg-gray-400');
            statusText.textContent = "Notulen worden opgeslagen in Drive...";

            try {
                // Laatste afronding in Google Script
                await callGAS("finalize", { transcript: fullTranscript });
                addLog("Succes! Documenten staan in je Drive.");
                statusText.textContent = "Klaar! Check je Drive en Mail.";
                
                // Na 3 seconden resetten we de knop voor een nieuwe vergadering
                setTimeout(() => {
                    location.reload();
                }, 3000);
                
            } catch (err) {
                addLog("Fout bij afronden: " + err.message);
                statusText.textContent = "Er ging iets mis bij het opslaan.";
            }
        }
    </script>
</body>
</html>
