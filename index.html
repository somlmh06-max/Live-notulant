<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCS Pro V8.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pulse-red { animation: pulse 1.5s infinite; }
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 40px rgba(220, 38, 38, 0); transform: scale(1.05); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); transform: scale(1); }
        }
        body { background-color: #f8fafc; touch-action: manipulation; }
        .recording-bg { background-color: #000000 !important; }
    </style>
</head>
<body>

    <div id="startScreen" class="flex flex-col items-center justify-center min-h-screen p-6">
        <div class="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center border-b-[12px] border-blue-900">
            <h1 class="text-4xl font-black text-blue-900 mb-2 italic">RCS PRO</h1>
            <p class="text-gray-400 mb-10 font-bold tracking-widest text-xs">VERSIE 8.1 - ANTI-SLEEP</p>
            <button id="startBtn" class="w-full bg-blue-600 text-white font-black py-8 rounded-3xl shadow-xl text-2xl active:scale-95 transition-all">
                START OPNAME
            </button>
        </div>
    </div>

    <div id="recordingScreen" class="hidden flex-col items-center justify-center min-h-screen recording-bg text-white p-6">
        <div id="timer" class="text-8xl font-mono font-bold mb-20 tracking-tighter text-red-600">00:00</div>
        <button id="stopBtn" class="w-64 h-64 bg-red-600 rounded-full pulse-red flex items-center justify-center text-4xl font-black shadow-2xl border-[12px] border-red-500/20">
            STOP
        </button>
        <div class="mt-20 text-gray-500 font-bold tracking-widest animate-pulse">TELEFOON BLIJFT WAKKER</div>
    </div>

    <div id="resultScreen" class="hidden fixed inset-0 bg-black/90 backdrop-blur-xl items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white w-full max-w-md rounded-[40px] p-8 shadow-2xl my-auto">
            <h2 class="text-3xl font-black text-gray-900 mb-2">Gereed!</h2>
            <div id="taskList" class="space-y-4 mb-10 max-h-64 overflow-y-auto pr-2 mt-4"></div>
            <button id="syncBtn" class="w-full bg-green-600 text-white font-bold py-5 rounded-2xl mb-4 shadow-lg flex items-center justify-center gap-3">
                SYNC NAAR TASKS
            </button>
            <a id="docLink" href="#" target="_blank" class="block w-full bg-blue-600 text-white text-center font-bold py-5 rounded-2xl shadow-lg">
                OPEN GOOGLE DOC
            </a>
            <button onclick="location.reload()" class="w-full text-gray-400 mt-8 font-bold text-sm uppercase tracking-widest">Nieuwe sessie</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz1whIpAifx0Xzh63GlyBpTEJwyzK3dzDw4G3qtwmO8hs-3H2dnZ982GmlOejRTEh3X/exec"; 
        let globalStream, mediaRecorder, fullTranscript = "", isRecording = false, timerInterval, seconds = 0, foundTasks = [], wakeLock = null;

        // Anti-Sleep truuk voor mobiel
        async function keepAwake() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
            // Blijf elke 10 seconden vragen om het scherm wakker te houden
            setInterval(async () => {
                if (isRecording && wakeLock === null && 'wakeLock' in navigator) {
                    try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
                }
            }, 10000);
        }

        // Als de pagina even weggaat (bijv. notificatie), herstel wakelock
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isRecording) {
                keepAwake();
            }
        });

        async function callGAS(action, payload) {
            const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }) });
            return (await res.json()).data;
        }

        async function startRecording() {
            if (!isRecording) return;
            mediaRecorder = new MediaRecorder(globalStream);
            mediaRecorder.ondataavailable = async (e) => {
                const reader = new FileReader();
                reader.readAsDataURL(e.data);
                reader.onloadend = async () => {
                    const text = await callGAS("processAudio", { base64: reader.result.split(',')[1] });
                    if (text) fullTranscript += text + " ";
                };
            };
            mediaRecorder.start();
            setTimeout(() => { if (isRecording) { mediaRecorder.stop(); startRecording(); } }, 10000);
        }

        document.getElementById('startBtn').onclick = async () => {
            globalStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            isRecording = true;
            keepAwake();
            
            document.body.classList.add('recording-bg');
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('recordingScreen').classList.replace('hidden', 'flex');
            
            startRecording();
            timerInterval = setInterval(() => {
                seconds++;
                const m = Math.floor(seconds/60).toString().padStart(2,'0');
                const s = (seconds%60).toString().padStart(2,'0');
                document.getElementById('timer').textContent = `${m}:${s}`;
            }, 1000);
        };

        document.getElementById('stopBtn').onclick = async () => {
            isRecording = false;
            if(wakeLock) wakeLock.release();
            clearInterval(timerInterval);
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('stopBtn').textContent = "...";
            const result = await callGAS("finalize", { transcript: fullTranscript });
            
            if (result) {
                document.getElementById('docLink').href = result.docUrl;
                foundTasks = result.tasks;
                const taskDiv = document.getElementById('taskList');
                foundTasks.forEach((t, i) => {
                    const item = document.createElement('label');
                    item.className = "flex items-center p-4 bg-gray-50 rounded-2xl border-2 border-gray-100 cursor-pointer active:bg-blue-50";
                    item.innerHTML = `<input type="checkbox" checked value="${i}" class="w-7 h-7 mr-4 rounded-full text-blue-600 border-2"> <span class="text-sm font-bold text-gray-700">${t}</span>`;
                    taskDiv.appendChild(item);
                });
                document.getElementById('resultScreen').classList.replace('hidden', 'flex');
            }
        };

        document.getElementById('syncBtn').onclick = async () => {
            const selectedIdx = Array.from(document.querySelectorAll('#taskList input:checked')).map(cb => cb.value);
            const selectedTasks = selectedIdx.map(i => foundTasks[i]);
            document.getElementById('syncBtn').textContent = "BEZIG...";
            const response = await callGAS("syncTasks", { tasks: selectedTasks });
            alert(response); // Laat de bevestiging of error direct zien
            document.getElementById('syncBtn').textContent = "✓ SYNC VOLTOOID";
            document.getElementById('syncBtn').classList.replace('bg-green-600', 'bg-gray-400');
        };
    </script>
</body>
</html>
