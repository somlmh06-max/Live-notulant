<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCS Notulist Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pulse-btn { animation: pulse 2s infinite; box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 35px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen transition-colors duration-500" id="bodyEl">

    <div id="startScreen" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center border-t-4 border-blue-900">
            <h1 class="text-2xl font-bold text-blue-900 mb-2">🎙️ RCS Notulist Pro</h1>
            <p class="text-gray-500 mb-8">Druk op start om de vergadering vast te leggen.</p>
            <button id="startBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-6 rounded-2xl shadow-lg text-xl active:scale-95 transition-all">
                START VERGADERING
            </button>
        </div>
    </div>

    <div id="recordingScreen" class="hidden flex-col items-center justify-center min-h-screen p-4 bg-black">
        <div class="w-full max-w-md text-center">
            <div id="timer" class="text-7xl font-mono font-bold text-white mb-16 tracking-widest">00:00:00</div>
            <button id="stopBtn" class="w-56 h-56 mx-auto bg-red-600 text-white font-bold rounded-full text-3xl pulse-btn flex items-center justify-center mb-12 active:scale-90 transition-all">
                STOP
            </button>
            <div id="log" class="text-left text-[10px] font-mono text-gray-500 h-48 overflow-y-auto p-4 border border-gray-900 rounded-xl bg-gray-950">
                <div>Systeem gestart... wacht op audio...</div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzsFFEO_TUsX1C2OMscKu1htgUF47fWkAjlhBMBmo5Orpv4XWLGMUQX5bJmz2bmFMVwnA/exec"; // <--- VUL DIT IN!

        let globalStream;
        let mediaRecorder;
        let fullTranscript = "";
        let isRecording = false;
        let timerInterval;
        let seconds = 0;
        let wakeLock = null;

        const log = document.getElementById('log');
        const timerDisplay = document.getElementById('timer');

        function addLog(msg, color = "text-gray-500") {
            const entry = document.createElement('div');
            entry.className = `py-1 border-b border-gray-900 ${color}`;
            entry.textContent = `${new Date().toLocaleTimeString()} - ${msg}`;
            log.prepend(entry);
        }

        async function callGAS(action, payload) {
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST', mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, ...payload })
                });
                const res = await response.json();
                return res.data;
            } catch (e) { return null; }
        }

        async function startNewRecorder() {
            if (!isRecording) return;

            const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/mp4';
            mediaRecorder = new MediaRecorder(globalStream, { mimeType });
            
            mediaRecorder.ondataavailable = async (event) => {
                if (event.data.size > 0) {
                    const blob = event.data;
                    const sizeKB = Math.round(blob.size / 1024);
                    addLog(`Audio verzonden (${sizeKB} KB)...`, "text-blue-400");
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = async () => {
                        const base64 = reader.result.split(',')[1];
                        const text = await callGAS("processAudio", { base64, mimeType });
                        if (text && !text.includes("[LEEG]")) {
                            fullTranscript += text + " ";
                            addLog("AI hoorde: " + text.substring(0, 30) + "...", "text-green-400");
                        } else {
                            addLog("AI hoorde niets (Stilte).", "text-gray-600");
                        }
                    };
                }
            };

            // We nemen op in blokken van 15 seconden
            mediaRecorder.start();
            setTimeout(() => {
                if (isRecording) {
                    mediaRecorder.stop();
                    startNewRecorder(); // Herstart direct voor een nieuw "vers" bestand
                }
            }, 15000);
        }

        document.getElementById('startBtn').onclick = async () => {
            try {
                globalStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isRecording = true;
                
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('recordingScreen').classList.remove('hidden');
                document.getElementById('recordingScreen').classList.add('flex');
                document.body.style.backgroundColor = "black";

                if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
                
                startNewRecorder();

                timerInterval = setInterval(() => {
                    seconds++;
                    const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
                    const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                    const s = (seconds % 60).toString().padStart(2, '0');
                    timerDisplay.textContent = `${h}:${m}:${s}`;
                }, 1000);
            } catch (err) {
                alert("Microfoon toegang is verplicht!");
            }
        };

        document.getElementById('stopBtn').onclick = async () => {
            isRecording = false;
            clearInterval(timerInterval);
            if (mediaRecorder) mediaRecorder.stop();
            if (wakeLock) wakeLock.release();

            document.getElementById('stopBtn').disabled = true;
            document.getElementById('stopBtn').textContent = "Wacht...";
            document.getElementById('stopBtn').classList.remove('pulse-btn');
            document.getElementById('stopBtn').style.backgroundColor = "#333";

            addLog("Eindverslag maken...", "text-yellow-500");

            setTimeout(async () => {
                const result = await callGAS("finalize", { transcript: fullTranscript });
                if (result && result.url) {
                    window.location.href = result.url;
                } else {
                    alert("Geen spraak gevonden om notulen van te maken.");
                    location.reload();
                }
            }, 2000);
        };
    </script>
</body>
</html>
