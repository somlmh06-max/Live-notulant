<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCS Smart V13.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white p-6 flex flex-col min-h-screen font-sans">

    <div class="flex-grow flex flex-col items-center justify-center py-10">
        <h1 class="text-blue-500 font-black tracking-widest text-2xl mb-8 text-center">RCS NOTULIST</h1>
        
        <input type="file" id="audioCapture" accept="audio/*" capture="microphone" class="hidden">
        <label for="audioCapture" id="mainBtn" class="w-56 h-56 bg-red-600 rounded-full flex flex-col items-center justify-center text-center p-6 shadow-2xl cursor-pointer active:scale-95 transition-all border-8 border-white/5">
            <span id="btnText" class="text-lg font-black leading-tight">START NIEUWE OPNAME</span>
        </label>
        
        <div id="retrySection" class="hidden mt-6 text-center">
            <p class="text-orange-500 font-bold mb-2 italic">De opname staat veilig in Drive!</p>
            <button onclick="processExisting()" class="bg-orange-600 px-6 py-3 rounded-full font-bold shadow-lg">PROBEER NOTULEREN OPNIEUW</button>
        </div>
    </div>

    <div class="w-full max-w-md mx-auto bg-zinc-900 rounded-3xl p-6 mb-4">
        <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-4">Recente opnames in Drive</h3>
        <div id="archiveList" class="space-y-3">
            <p class="text-zinc-600 text-sm italic">Lijst laden...</p>
        </div>
    </div>

    <div id="loader" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-10 text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-blue-500 mb-4"></div>
        <h2 id="loadText" class="text-xl font-bold">Verwerken...</h2>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxr2V0X4W_kKiBBdaJHfKlVlvErbejfyNTX3p3DKzxu2dKYcYZrWldTQThGLXC-5hAwlQ/exec";
        let savedFileId = null;

        // 1. Laad het archief bij opstarten
        window.onload = refreshArchive;

        async function refreshArchive() {
            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "listAudio" }) });
                const data = await res.json();
                const list = document.getElementById('archiveList');
                list.innerHTML = "";
                if(data.files.length === 0) list.innerHTML = "<p class='text-zinc-600 text-sm'>Geen losse opnames gevonden.</p>";
                data.files.forEach(f => {
                    list.innerHTML += `
                        <div class="flex items-center justify-between bg-zinc-800 p-3 rounded-xl border border-zinc-700">
                            <div class="text-left overflow-hidden">
                                <p class="text-xs font-bold truncate">${f.name}</p>
                                <p class="text-[10px] text-zinc-500">${new Date(f.date).toLocaleString()}</p>
                            </div>
                            <button onclick="processArchive('${f.id}')" class="bg-blue-600 text-[10px] px-3 py-2 rounded-lg font-bold">NOTULEER</button>
                        </div>`;
                });
            } catch(e) {}
        }

        // 2. Nieuwe opname afhandelen
        document.getElementById('audioCapture').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = async () => {
                document.getElementById('loader').classList.remove('hidden');
                document.getElementById('loadText').innerText = "Audio beveiligen...";
                
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ base64: reader.result.split(',')[1], mimeType: file.type })
                });
                handleResponse(await response.json());
            };
        });

        // 3. Bestaande (gefaalde) sessie opnieuw proberen
        async function processExisting() {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('loadText').innerText = "AI opnieuw aanroepen...";
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ fileId: savedFileId })
            });
            handleResponse(await response.json());
        }

        // 4. Archiefstuk verwerken
        async function processArchive(id) {
            savedFileId = id;
            processExisting();
        }

        function handleResponse(res) {
            document.getElementById('loader').classList.add('hidden');
            if (res.status === "success") {
                window.open(res.docUrl, '_blank');
                alert("Geslaagd! Het document is geopend.");
                location.reload();
            } else if (res.status === "ai_busy") {
                savedFileId = res.audioFileId;
                document.getElementById('retrySection').classList.remove('hidden');
                document.getElementById('mainBtn').classList.add('opacity-30');
                alert("AI nog steeds druk. Audio is veilig bewaard in Drive. Probeer het over een minuutje weer via de oranje knop of onderin het archief.");
                refreshArchive();
            }
        }
    </script>
</body>
</html>
