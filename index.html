<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCS DEBUG V11.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-6 flex flex-col h-screen font-sans">

    <div class="text-center mb-4">
        <h1 class="text-blue-400 font-bold">RCS SYSTEM CHECK</h1>
        <div id="timer" class="text-4xl font-mono">00:00</div>
    </div>

    <div id="livePreview" class="flex-grow bg-slate-800 rounded-2xl p-4 mb-4 overflow-y-auto text-sm border border-slate-700 shadow-inner">
        Wacht op eerste 6 seconden...
    </div>

    <div id="viz" class="flex items-end justify-center gap-1 h-12 mb-6"></div>

    <div id="errorLog" class="text-[10px] text-red-400 font-mono mb-4 h-10 overflow-hidden bg-black/20 p-2 rounded">
        Systeem status: OK
    </div>

    <div class="flex flex-col gap-4">
        <button id="mainBtn" class="w-full bg-blue-600 py-6 rounded-2xl font-black text-xl shadow-lg active:bg-blue-700">START OPNAME</button>
        <button id="pauseBtn" class="hidden w-full bg-slate-700 py-4 rounded-2xl font-bold">PAUZE</button>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-6 z-50">
        <div class="bg-white text-black p-8 rounded-[2rem] w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-4">Klaar!</h2>
            <a id="docLink" href="#" target="_blank" class="block w-full bg-blue-600 text-white py-4 rounded-xl font-bold">OPEN DOC</a>
            <button onclick="location.reload()" class="mt-6 text-gray-400 text-xs uppercase font-bold">Opnieuw</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwM3miFqYLvsk5_jqF3Z3bR7yaTPnf2E70ISjwktW5LXxpncrkElMLgBSEnm9xP8mZNtw/exec"; // VERGEET DEZE NIET!
        let isRecording = false, isPaused = false, seconds = 0, timer, fullTranscript = "", stream, recorder;

        const log = (msg) => { document.getElementById('errorLog').innerText = "LOG: " + msg; };

        async function recordChunk() {
            if (!isRecording || isPaused) return;
            
            // Probeer specifiek audio/webm voor Android of audio/mp4 voor iPhone
            const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
            recorder = new MediaRecorder(stream, { mimeType: mime });

            recorder.ondataavailable = async (e) => {
                const reader = new FileReader();
                reader.readAsDataURL(e.data);
                reader.onloadend = async () => {
                    const base64 = reader.result.split(',')[1];
                    try {
                        log("Stukje audio versturen...");
                        const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "processAudio", base64: base64 }) });
                        const json = await res.json();
                        if (json.status === "success" && json.data) {
                            fullTranscript += json.data + " ";
                            document.getElementById('livePreview').innerText = fullTranscript;
                            log("Tekst ontvangen!");
                        } else {
                            log("Geen tekst uit audio (stilte?)");
                        }
                    } catch(err) {
                        log("VERBINDINGSFOUT: " + err.message);
                    }
                };
            };
            recorder.start();
            setTimeout(() => { if (isRecording && !isPaused) { recorder.stop(); recordChunk(); } }, 6000);
        }

        document.getElementById('mainBtn').onclick = async () => {
            if (!isRecording) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    isRecording = true;
                    document.getElementById('mainBtn').innerText = "STOP EN MAAK NOTULEN";
                    document.getElementById('mainBtn').classList.replace('bg-blue-600', 'bg-red-600');
                    document.getElementById('pauseBtn').classList.remove('hidden');
                    recordChunk();
                    startViz();
                    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('timer').innerText = new Date(seconds*1000).toISOString().substr(14, 5); } }, 1000);
                } catch(e) { alert("Mic error: " + e); }
            } else {
                isRecording = false;
                document.getElementById('mainBtn').innerText = "VERWERKEN...";
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "finalize", transcript: fullTranscript }) });
                const json = await res.json();
                if (json.status === "success") {
                    document.getElementById('docLink').href = json.data.docUrl;
                    document.getElementById('modal').classList.remove('hidden');
                } else {
                    alert("Fout: " + json.data);
                    location.reload();
                }
            }
        };

        document.getElementById('pauseBtn').onclick = () => {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').innerText = isPaused ? "GA DOOR" : "PAUZE";
            if (!isPaused) recordChunk();
        };

        function startViz() {
            const ctx = new AudioContext();
            const src = ctx.createMediaStreamSource(stream);
            const ana = ctx.createAnalyser();
            src.connect(ana);
            const data = new Uint8Array(ana.frequencyBinCount);
            const container = document.getElementById('viz');
            for(let i=0; i<15; i++) container.innerHTML += '<div class="w-1.5 bg-blue-400 rounded-full h-1"></div>';
            const bars = container.children;
            function draw() {
                if(!isRecording) return;
                requestAnimationFrame(draw);
                ana.getByteFrequencyData(data);
                for(let i=0; i<15; i++) bars[i].style.height = isPaused ? "4px" : (data[i*10]/3 + 4) + "px";
            }
            draw();
        }
    </script>
</body>
</html>
