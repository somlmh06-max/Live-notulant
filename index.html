<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCS Notulist Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
        <h1 class="text-2xl font-bold text-blue-900 mb-2">🎙️ RCS Notulist Pro</h1>
        <p id="statusText" class="text-gray-500 mb-6">Systeem gereed</p>

        <div id="timer" class="text-4xl font-mono font-bold text-gray-800 mb-8">00:00:00</div>

        <button id="recordBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95">
            Start Vergadering
        </button>

        <div id="log" class="mt-6 text-left text-xs text-gray-400 max-h-32 overflow-y-auto p-2 border-t"></div>
    </div>

    <script>
        // PLAK HIER JE GOOGLE WEB APP URL (na implementatie)
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw4KWYtV8bDMYjhLzNpKXDdWHYfom6f_opZJQjmk6klhhKO5P4MUqVenIf_4RSoeIEwfg/exec";

        let mediaRecorder;
        let audioChunks = [];
        let fullTranscript = "";
        let isRecording = false;
        let timerInterval;
        let seconds = 0;

        const recordBtn = document.getElementById('recordBtn');
        const statusText = document.getElementById('statusText');
        const timerDisplay = document.getElementById('timer');
        const log = document.getElementById('log');

        function addLog(msg) {
            const entry = document.createElement('div');
            entry.textContent = `${new Date().toLocaleTimeString()} - ${msg}`;
            log.prepend(entry);
        }

        async function callGAS(action, payload) {
            const body = JSON.stringify({ action: action, ...payload });
            const response = await fetch(WEB_APP_URL, { method: 'POST', body: body });
            const res = await response.json();
            return res.data;
        }

        recordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    
                    mediaRecorder.ondataavailable = async (event) => {
                        if (event.data.size > 0) {
                            const reader = new FileReader();
                            reader.readAsDataURL(event.data);
                            reader.onloadend = async () => {
                                const base64 = reader.result.split(',')[1];
                                addLog("Segment verzenden...");
                                const text = await callGAS("processAudio", { base64: base64 });
                                if (text) fullTranscript += text + " ";
                                addLog("Ontvangen: " + (text ? text.substring(0, 20) + "..." : "Stilte"));
                            };
                        }
                    };

                    mediaRecorder.start(15000); // Elke 15 sec een stukje
                    isRecording = true;
                    recordBtn.textContent = "Stop & Genereer Notulen";
                    recordBtn.classList.replace('bg-blue-700', 'bg-red-600');
                    statusText.textContent = "Aan het opnemen...";
                    
                    timerInterval = setInterval(() => {
                        seconds++;
                        timerDisplay.textContent = new Date(seconds * 1000).toISOString().substr(11, 8);
                    }, 1000);

                } catch (err) {
                    alert("Microfoon geweigerd: " + err.message);
                }
            } else {
                stopRecording();
            }
        };

        async function stopRecording() {
            isRecording = false;
            clearInterval(timerInterval);
            mediaRecorder.stop();
            recordBtn.disabled = true;
            recordBtn.textContent = "Verwerken...";
            statusText.textContent = "Notulen worden gemaakt, even geduld...";

            try {
                const result = await callGAS("finalize", { transcript: fullTranscript });
                statusText.textContent = "Klaar! Notulen verzonden naar " + result.titel;
                addLog("Succes: " + result.url);
                window.location.href = result.url;
            } catch (err) {
                addLog("Fout bij afronden: " + err.message);
            }
        }
    </script>
</body>
</html>
