<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCS Master V11.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex flex-col h-screen p-6 overflow-hidden">

    <div class="text-center">
        <h1 class="text-blue-500 font-black tracking-tighter text-2xl">RCS INTELLIGENCE</h1>
        <div id="timer" class="text-6xl font-mono mt-4">00:00</div>
    </div>

    <div id="livePreview" class="flex-grow my-8 bg-zinc-900 border border-zinc-800 p-6 rounded-3xl overflow-y-auto text-zinc-400 italic text-lg shadow-inner">
        Wacht op spraak... (Begin met praten)
    </div>

    <div class="flex flex-col items-center gap-8 mb-10">
        <button id="mainBtn" class="w-40 h-40 bg-red-600 rounded-full flex items-center justify-center text-xl font-black shadow-[0_0_50px_rgba(220,38,38,0.3)] active:scale-95 transition-all">START</button>
        <button id="pauseBtn" class="hidden w-full max-w-xs bg-zinc-800 py-4 rounded-2xl font-bold border border-zinc-700">PAUZE</button>
    </div>

    <div id="resultModal" class="hidden fixed inset-0 bg-black/95 flex flex-col items-center justify-center p-6 z-50">
        <div class="bg-white text-black w-full max-w-md rounded-[3rem] p-10">
            <h2 class="text-3xl font-black mb-6">Klaar!</h2>
            <div id="taskList" class="space-y-3 mb-8 max-h-40 overflow-y-auto border-y py-4"></div>
            <button id="syncBtn" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl mb-3">SYNC TASKS</button>
            <a id="docLink" href="#" target="_blank" class="block w-full bg-blue-600 text-white text-center font-bold py-4 rounded-xl">OPEN DOCUMENT</a>
            <button onclick="location.reload()" class="w-full mt-8 text-gray-400 font-bold text-xs uppercase tracking-widest">Opnieuw</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzGk8ssTr3vLp-Vg8DUtBpas0Y3_P0LDPHHlblDvPLxc8F0ssuJ4QOwUQTN5n1wFQL7aA/exec"; 
        let isRecording = false, isPaused = false, seconds = 0, timerInterval, wakeLock = null, globalStream, mediaRecorder, fullTranscript = "";

        async function startChunk() {
            if (!isRecording || isPaused) return;
            mediaRecorder = new MediaRecorder(globalStream);
            mediaRecorder.ondataavailable = async (e) => {
                const reader = new FileReader();
                reader.readAsDataURL(e.data);
                reader.onloadend = async () => {
                    try {
                        const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "processAudio", base64: reader.result.split(',')[1] }) });
                        const json = await res.json();
                        if (json.data) {
                            fullTranscript += json.data + " ";
                            document.getElementById('livePreview').innerText = fullTranscript;
                            document.getElementById('livePreview').scrollTop = document.getElementById('livePreview').scrollHeight;
                        }
                    } catch(e) {}
                };
            };
            mediaRecorder.start();
            setTimeout(() => { if (isRecording && !isPaused) { mediaRecorder.stop(); startChunk(); } }, 5000);
        }

        document.getElementById('mainBtn').onclick = async () => {
            if (!isRecording) {
                globalStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isRecording = true;
                document.getElementById('mainBtn').textContent = "STOP";
                document.getElementById('pauseBtn').classList.remove('hidden');
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
                startChunk();
                timerInterval = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('timer').textContent = new Date(seconds * 1000).toISOString().substr(14, 5); } }, 1000);
            } else {
                isRecording = false;
                clearInterval(timerInterval);
                document.getElementById('mainBtn').textContent = "...";
                document.getElementById('mainBtn').disabled = true;
                
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "finalize", transcript: fullTranscript }) });
                const json = await res.json();
                if (json.status === "success") {
                    document.getElementById('docLink').href = json.data.docUrl;
                    json.data.tasks.forEach(t => {
                        document.getElementById('taskList').innerHTML += `<div class="flex items-center gap-3 font-bold text-sm border-b pb-2"><input type="checkbox" checked> ${t}</div>`;
                    });
                    document.getElementById('resultModal').classList.replace('hidden', 'flex');
                } else {
                    alert("Fout: " + json.data);
                }
            }
        };

        document.getElementById('pauseBtn').onclick = () => {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').textContent = isPaused ? "GA DOOR" : "PAUZE";
            if (!isPaused) startChunk();
        };
    </script>
</body>
</html>
