<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>RCS Notulist Pro (Production)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
  <style>
    @keyframes pulse-red { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; box-shadow: 0 0 0 12px rgba(239, 68, 68, 0.3); } }
    .recording-active { animation: pulse-red 2s infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

  <header class="bg-[#0f4c81] text-white shadow-md py-4 px-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div><h1 class="text-xl font-bold tracking-tight">RCS Notulist Pro</h1><p class="text-xs text-slate-200/80">Directie-assistent • Workspace Connected</p></div>
    </div>
  </header>

  <main class="flex-grow max-w-xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      
      <div class="bg-slate-100 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
        <h2 id="panel-title" class="text-sm font-bold text-slate-500 uppercase tracking-wider">Vergadering Opnemen</h2>
        <div id="timer" class="text-lg font-mono font-bold text-slate-400 hidden">00:00:00</div>
      </div>

      <div class="p-6 sm:p-8 space-y-6">
        <div id="status-container" class="text-center space-y-2">
          <p id="status-text" class="text-slate-600 font-medium">Klik op de microfoon om te starten.</p>
          <p id="sub-status" class="text-xs text-slate-400">Het scherm blijft actief tijdens het opnemen.</p>
        </div>

        <div id="progress-container" class="space-y-2 hidden">
          <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden border border-slate-200">
            <div id="progress-bar" class="bg-[#0f4c81] h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <div class="flex flex-col items-center justify-center py-4">
          <button id="record-btn" class="w-28 h-28 bg-red-600 hover:bg-red-700 text-white rounded-full flex items-center justify-center shadow-lg transition-all focus:outline-none">
            <svg id="mic-icon" class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            <svg id="stop-icon" class="w-12 h-12 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H10a1 1 0 01-1-1v-4z"></path></svg>
          </button>
          <p id="button-label" class="text-xs font-bold uppercase tracking-widest text-red-600 mt-4">Start Opname</p>
        </div>

        <div id="result-box" class="hidden border-t border-slate-200 pt-6 space-y-4">
          <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-center">
            <h4 class="text-emerald-800 font-bold text-sm">Notulen Klaar & Gemaild!</h4>
          </div>
          <a id="doc-link" href="#" target="_blank" class="w-full bg-[#0f4c81] text-white font-bold py-3.5 px-4 rounded-xl text-center block text-sm tracking-wide uppercase">📄 Open Document</a>
          <div id="tasks-preview" class="space-y-2 hidden">
            <ul id="tasks-list" class="text-xs bg-slate-50 border border-slate-200 rounded-xl p-3 divide-y divide-slate-100 space-y-2"></ul>
            <button id="sync-tasks-btn" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl uppercase tracking-wider text-xs">Zet actiepunten in Google Tasks</button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    // Controleer of dit overeenkomt met de nieuwste implementatie van je Code.gs Web App
    const API_URL = "https://script.google.com/macros/s/AKfycbwlttoaki8mnftPHk_qGnSBBGIctDVS6zVF_fTVGGpLJ8I68ao8-5BlbJmLYpNq4EtyPA/exec";
    
    let mediaRecorder, audioChunks = [], startTime, timerInterval, isRecording = false;
    let noSleep = new NoSleep();
    let pendingTasks = [], finalDocUrl = "";

    const recordBtn = document.getElementById('record-btn');
    const micIcon = document.getElementById('mic-icon');
    const stopIcon = document.getElementById('stop-icon');
    const buttonLabel = document.getElementById('button-label');
    const timerDisplay = document.getElementById('timer');
    const statusText = document.getElementById('status-text');
    const subStatus = document.getElementById('sub-status');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const resultBox = document.getElementById('result-box');
    const docLink = document.getElementById('doc-link');
    const tasksPreview = document.getElementById('tasks-preview');
    const tasksList = document.getElementById('tasks-list');
    const syncBtn = document.getElementById('sync-tasks-btn');

    async function callAppsScript(payload) {
      const res = await fetch(API_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    recordBtn.addEventListener('click', async () => {
      if (!isRecording) await startRecording(); else stopRecording();
    });

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        noSleep.enable();
        
        let options = { mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4' };
        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
        
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
          const ext = (mediaRecorder.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
          const fileName = 'RCS_Audio_' + Date.now() + '.' + ext;
          verwerkVergaderingZonderLimiet(blob, fileName, blob.type || 'audio/webm');
        };

        mediaRecorder.start(1000); 
        isRecording = true;
        startTime = Date.now();
        timerInterval = setInterval(() => {
          const s = Math.floor((Date.now() - startTime) / 1000);
          timerDisplay.innerText = [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map(v => String(v).padStart(2, '0')).join(':');
        }, 1000);
        
        recordBtn.classList.add('bg-red-700', 'recording-active');
        micIcon.classList.add('hidden'); stopIcon.classList.remove('hidden');
        timerDisplay.classList.remove('hidden'); resultBox.classList.add('hidden');
        buttonLabel.innerText = "Stop Opname";
        statusText.innerText = "Systeem luistert mee..."; statusText.classList.add('text-red-600', 'font-bold');
        document.getElementById('panel-title').innerText = "Opname Actief";
      } catch (err) {
        alert("Microfoonfout. Controleer of je browser toegang heeft tot de microfoon.");
      }
    }

    function stopRecording() {
      if (!mediaRecorder) return;
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop()); 
      noSleep.disable();
      clearInterval(timerInterval);
      isRecording = false;
      
      recordBtn.classList.remove('bg-red-700', 'recording-active');
      micIcon.classList.remove('hidden'); stopIcon.classList.add('hidden');
      buttonLabel.innerText = "Verwerken...";
    }

    function updateStatusUI(hoofdtekst, subtekst, percentage) {
      statusText.innerText = hoofdtekst;
      subStatus.innerText = subtekst;
      progressBar.style.width = percentage + '%';
    }

    // --- DE NIEUWE OPLOSSING ZONDER GROOTTE-LIMIET ---
    async function verwerkVergaderingZonderLimiet(audioBlob, bestandsNaam, mimeType) {
      recordBtn.disabled = true; recordBtn.classList.add('opacity-40');
      progressContainer.classList.remove('hidden');
      document.getElementById('panel-title').innerText = "Cloud Overdracht";
      progressBar.classList.add('animate-pulse', 'bg-emerald-600');
      statusText.classList.remove('text-red-600');

      try {
        updateStatusUI("1/4: Netwerkconfiguratie laden...", "Verbinden met Google Workspace", 10);
        const settingsRes = await fetch(API_URL, {
          method: "POST", redirect: "follow", body: JSON.stringify({ action: "getSettings" })
        });
        const settings = await settingsRes.json();
        if (!settings.success) throw new Error("Kon cloud-instellingen niet ophalen.");

        updateStatusUI("2/4: Audio rechtstreeks uploaden...", "Directe link met AI Studio (geen tijdslimiet)", 30);
        const geminiInit = await fetch(`https://generativelanguage.googleapis.com/upload/v1beta/files?key=${settings.apiKey}`, {
          method: "POST",
          headers: {
            "X-Goog-Upload-Protocol": "resumable",
            "X-Goog-Upload-Command": "start",
            "X-Goog-Upload-Header-Content-Length": audioBlob.size,
            "X-Goog-Upload-Header-Content-Type": mimeType,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ file: { displayName: bestandsNaam } })
        });
        
        const geminiUploadUrl = geminiInit.headers.get("X-Goog-Upload-URL");
        const geminiUpload = await fetch(geminiUploadUrl, {
          method: "POST",
          headers: {
            "X-Goog-Upload-Command": "upload, finalize",
            "X-Goog-Upload-Offset": "0",
            "Content-Type": "application/octet-stream"
          },
          body: audioBlob
        });
        const geminiFile = await geminiUpload.json();

        updateStatusUI("3/4: Back-up opslaan...", "Kopie bewaren in het archief", 65);
        try {
          const driveInit = await fetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${settings.token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ name: bestandsNaam, parents: [settings.archiefFolderId] })
          });
          const driveUploadUrl = driveInit.headers.get("Location");
          if(driveUploadUrl) {
            await fetch(driveUploadUrl, { method: "PUT", headers: { "Content-Type": mimeType }, body: audioBlob });
          }
        } catch(e) { console.warn("Archief overgeslagen, we gaan door:", e); }

        updateStatusUI("4/4: Vlijmscherpe analyse uitvoeren...", "Notulen en document genereren", 85);
        const processResponse = await fetch(API_URL, {
          method: "POST", redirect: "follow",
          body: JSON.stringify({
            action: "processDirectUpload",
            fileUri: geminiFile.file.uri,
            geminiFileName: geminiFile.file.name,
            mimeType: mimeType
          })
        });
        
        const eindResultaat = await processResponse.json();
        if (eindResultaat.success) {
          finalDocUrl = eindResultaat.docUrl; 
          pendingTasks = eindResultaat.tasks || [];
          updateStatusUI("Voltooid", "Gereed", 100);
          showSuccess();
        } else {
          throw new Error(eindResultaat.error);
        }

      } catch (fout) {
        alert("⚠️ Fout opgetreden: " + fout.message); 
        location.reload();
      }
    }

    function showSuccess() {
      progressContainer.classList.add('hidden'); recordBtn.classList.add('hidden'); buttonLabel.classList.add('hidden'); timerDisplay.classList.add('hidden');
      document.getElementById('panel-title').innerText = "Succesvol Verwerkt";
      statusText.innerText = "Notulen zijn opgeslagen en gemaild!"; subStatus.innerText = "";
      
      docLink.href = finalDocUrl;
      resultBox.classList.remove('hidden');

      if (pendingTasks.length > 0) {
        tasksList.innerHTML = pendingTasks.map(t => `<li class="py-1 flex items-start gap-2"><span class="text-emerald-500">✓</span> <span>${t}</span></li>`).join('');
        tasksPreview.classList.remove('hidden');
      }
    }

    syncBtn.addEventListener('click', async () => {
      syncBtn.innerText = "BEZIG MET SYNCHRONISEREN..."; syncBtn.disabled = true;
      try {
        await callAppsScript({ action: "syncTasks", tasks: pendingTasks, docUrl: finalDocUrl });
        syncBtn.innerText = "✓ TOEGEVOEGD AAN GOOGLE TASKS"; syncBtn.classList.replace('bg-emerald-600', 'bg-slate-400');
      } catch(e) { alert("Fout bij syncen."); syncBtn.innerText = "PROBEER OPNIEUW"; syncBtn.disabled = false; }
    });
  </script>
</body>
</html>
