<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCS Pro V13</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white p-8 flex flex-col h-screen items-center justify-center font-sans">

    <div class="text-center mb-12">
        <h1 class="text-blue-500 font-black tracking-widest text-2xl">RCS NOTULIST PRO</h1>
        <p class="text-zinc-500 mt-2">Versie 13.0 | Native Audio</p>
    </div>

    <div class="relative">
        <input type="file" id="audioCapture" accept="audio/*" capture="microphone" class="hidden">
        <label for="audioCapture" class="w-64 h-64 bg-red-600 rounded-full flex flex-col items-center justify-center text-center p-6 shadow-[0_0_60px_rgba(220,38,38,0.3)] active:scale-95 transition-all cursor-pointer border-8 border-white/10">
            <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            <span class="text-xl font-black">START OPNAME</span>
        </label>
    </div>

    <div id="processing" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-10">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500 mb-6"></div>
        <h2 class="text-2xl font-bold">Notulen worden gemaakt...</h2>
        <p class="text-zinc-400 mt-2 text-center">De AI verwerkt nu de audio en schrijft het Google Doc. Een moment geduld.</p>
    </div>

    <div id="success" class="hidden fixed inset-0 bg-zinc-900 z-50 flex flex-col items-center justify-center p-10">
        <div class="bg-white text-black p-8 rounded-[3rem] w-full max-w-sm text-center">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-3xl font-black mb-4">Gereed!</h2>
            <a id="docLink" href="#" target="_blank" class="block w-full bg-blue-600 text-white py-5 rounded-2xl font-bold text-lg mb-4">OPEN NOTULEN</a>
            <button onclick="location.reload()" class="text-zinc-400 font-bold uppercase text-xs tracking-widest">Nieuwe opname</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyKjN_vaGZez0x4TM4KiDNOg80jHnUAmeRn6lnm6IqOF9dsYI0-EI27Ub7DyyxNHgdfrw/exec";

        document.getElementById('audioCapture').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('processing').classList.remove('hidden');

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = async () => {
                const base64 = reader.result.split(',')[1];
                
                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ base64: base64 })
                    });
                    const res = await response.json();
                    
                    if (res.status === "success") {
                        document.getElementById('processing').classList.add('hidden');
                        document.getElementById('success').classList.remove('hidden');
                        document.getElementById('docLink').href = res.docUrl;
                    } else {
                        alert("Fout: " + res.message);
                        location.reload();
                    }
                } catch (err) {
                    alert("Netwerkfout. Is het bestand te groot?");
                    location.reload();
                }
            };
        });
    </script>
</body>
</html>
