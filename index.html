<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>RCS Notulist Pro (GitHub Edition)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
  <style>
    @keyframes pulse-red { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; box-shadow: 0 0 0 12px rgba(239, 68, 68, 0.3); } }
    .recording-active { animation: pulse-red 2s infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

  <header class="bg-[#0f4c81] text-white shadow-md py-4 px-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div><h1 class="text-xl font-bold tracking-tight">RCS Notulist Pro</h1><p class="text-xs text-slate-200/80">Directie-assistent • GitHub Secure Hosted</p></div>
    </div>
  </header>

  <main class="flex-grow max-w-xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      
      <div class="bg-slate-100 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
        <h2 id="panel-title" class="text-sm font-bold text-slate-500 uppercase tracking-wider">Vergadering Opnemen</h2>
        <div id="timer" class="text-lg font-mono font-bold text-slate-400 hidden">00:00:00</div>
      </div>

      <div class="p-6 sm:p-8 space-y-6">
        <div id="status-container" class="text-center space-y-2">
          <p id="status-text" class="text-slate-600 font-medium">Klik op de microfoon om de opname te starten.</p>
          <p id="sub-status" class="text-xs text-slate-400">Jouw telefoon blijft wakker tijdens de vergadering.</p>
        </div>

        <div id="progress-container" class="space-y-2 hidden">
          <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden border border-slate-200">
            <div id="progress-bar" class="bg-[#0f4c81] h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <div class="flex flex-col items-center justify-center py-4">
          <button id="record-btn" class="w-28 h-28 bg-red-600 hover:bg-red-700 text-white rounded-full flex items-center justify-center shadow-lg transition-all focus:outline-none">
            <svg id="mic-icon" class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            <svg id="stop-icon" class="w-12 h-12 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H10a1 1 0 01-1-1v-4z"></path></svg>
          </button>
          <p id="button-label" class="text-xs font-bold uppercase tracking-widest text-red-600 mt-4">Start Opname</p>
        </div>

        <div id="result-box" class="hidden border-t border-slate-200 pt-6 space-y-4">
          <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-center">
            <h4 class="text-emerald-800 font-bold text-sm">Notulen Gegenereerd!</h4>
          </div>
          <a id="doc-link" href="#" target="_blank" class="w-full bg-[#0f4c81] text-white font-bold py-3.5 px-4 rounded-xl text-center block text-sm tracking-wide uppercase">📄 Open Document</a>
          <div id="tasks-preview" class="space-y-2 hidden">
            <ul id="tasks-list" class="text-xs bg-slate-50 border border-slate-200 rounded-xl p-3 divide-y divide-slate-100 space-y-2"></ul>
            <button id="sync-tasks-btn" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl uppercase tracking-wider text-xs">Zet alles in Google Tasks</button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    // Jouw specifieke Web App URL is hier gekoppeld
    const API_URL = "https://script.google.com/macros/s/AKfycbzyZvv30aQba2jN49smuZeSHvVNsIJ4eyMKgd7M58h3_TT4rvxjy20TA6O6k8HOmcZy8g/exec";
    
    let mediaRecorder, audioChunks = [], startTime, timerInterval, isRecording = false;
    let noSleep = new NoSleep();
    let pendingTasks = [], finalDocUrl = "";
    const CHUNK_SIZE = 1024 * 1024; 

    // UI Elementen
    const recordBtn = document.getElementById('record-btn');
    const micIcon = document.getElementById('mic-icon');
    const stopIcon = document.getElementById('stop-icon');
    const buttonLabel = document.getElementById('button-label');
    const timerDisplay = document.getElementById('timer');
    const statusText = document.getElementById('status-text');
    const subStatus = document.getElementById('sub-status');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const resultBox = document.getElementById('result-box');
    const docLink = document.getElementById('doc-link');
    const tasksPreview = document.getElementById('tasks-preview');
    const tasksList = document.getElementById('tasks-list');
    const syncBtn = document.getElementById('sync-tasks-btn');

    // Netwerk communicatie naar Google Apps Script (Bypass CORS)
    async function callAppsScript(payload) {
      const res = await fetch(API_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    recordBtn.addEventListener('click', async () => {
      if (!isRecording) await startRecording(); else stopRecording();
    });

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        noSleep.enable();
        
        let options = { mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4' };
        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => processAndUploadBlob(new Blob(audioChunks, { type: mediaRecorder.mimeType }));

        mediaRecorder.start(1000); 
        isRecording = true;
        startTime = Date.now();
        timerInterval = setInterval(() => {
          const s = Math.floor((Date.now() - startTime) / 1000);
          timerDisplay.innerText = [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map(v => String(v).padStart(2, '0')).join(':');
        }, 1000);
        
        recordBtn.classList.add('bg-red-700', 'recording-active');
        micIcon.classList.add('hidden'); stopIcon.classList.remove('hidden');
        timerDisplay.classList.remove('hidden'); resultBox.classList.add('hidden');
        buttonLabel.innerText = "Stop Opname";
        statusText.innerText = "De microfoon luistert actief..."; statusText.classList.add('text-red-600', 'font-bold');
        document.getElementById('panel-title').innerText = "Opname Bezig...";
      } catch (err) {
        alert("Microfoonfout. Controleer of de browser rechten heeft om de microfoon te gebruiken.");
      }
    }

    function stopRecording() {
      if (!mediaRecorder) return;
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop()); 
      noSleep.disable();
      clearInterval(timerInterval);
      isRecording = false;
      
      recordBtn.classList.remove('bg-red-700', 'recording-active');
      micIcon.classList.remove('hidden'); stopIcon.classList.add('hidden');
      buttonLabel.innerText = "Verwerken...";
    }

    async function processAndUploadBlob(blob) {
      const totalChunks = Math.ceil(blob.size / CHUNK_SIZE);
      const uid = 'rcs_' + Date.now();
      const mimeType = blob.type || 'audio/webm';
      const fileName = 'RCS_Audio_' + uid + '.' + (mimeType.includes('mp4') ? 'mp4' : 'webm');

      recordBtn.disabled = true; recordBtn.classList.add('opacity-40');
      progressContainer.classList.remove('hidden');
      document.getElementById('panel-title').innerText = "Data Verzenden";

      try {
        for (let i = 0; i < totalChunks; i++) {
          const chunkBlob = blob.slice(i * CHUNK_SIZE, Math.min((i + 1) * CHUNK_SIZE, blob.size));
          const base64Data = await new Promise(res => { const r = new FileReader(); r.onloadend = () => res(r.result.split(',')[1]); r.readAsDataURL(chunkBlob); });
          
          progressBar.style.width = Math.round(((i + 1) / totalChunks) * 100) + '%';
          statusText.innerText = `Audio uploaden...`; subStatus.innerText = `Deel ${i + 1}/${totalChunks}`;
          
          const res = await callAppsScript({ action: "saveChunk", base64: base64Data, index: i, uid: uid });
          if (!res.success) throw new Error("Upload mislukt: " + res.error);
        }

        statusText.innerText = "AI analyseert de vergadering...";
        progressBar.classList.add('animate-pulse', 'bg-emerald-600');
        
        const finalRes = await callAppsScript({ action: "finalizeUpload", fileName: fileName, mimeType: mimeType, uid: uid, totalChunks: totalChunks });
        if (finalRes.success) {
           finalDocUrl = finalRes.docUrl; pendingTasks = finalRes.tasks || [];
           showSuccess();
        } else throw new Error(finalRes.error);
      } catch (err) {
        alert("Er is iets misgegaan: " + err.message); location.reload();
      }
    }

    function showSuccess() {
      progressContainer.classList.add('hidden'); recordBtn.classList.add('hidden'); buttonLabel.classList.add('hidden'); timerDisplay.classList.add('hidden');
      document.getElementById('panel-title').innerText = "Voltooid";
      statusText.innerText = "Notulen zijn opgesteld!"; statusText.classList.remove('text-red-600'); subStatus.innerText = "";
      
      docLink.href = finalDocUrl;
      resultBox.classList.remove('hidden');

      if (pendingTasks.length > 0) {
        tasksList.innerHTML = pendingTasks.map(t => `<li class="py-1 flex items-start gap-2"><span class="text-emerald-500">✓</span> <span>${t}</span></li>`).join('');
        tasksPreview.classList.remove('hidden');
      }
    }

    syncBtn.addEventListener('click', async () => {
      syncBtn.innerText = "BEZIG..."; syncBtn.disabled = true;
      try {
        await callAppsScript({ action: "syncTasks", tasks: pendingTasks, docUrl: finalDocUrl });
        syncBtn.innerText = "✓ SUCCESVOL VERZONDEN NAAR TAKEN"; syncBtn.classList.replace('bg-emerald-600', 'bg-slate-400');
      } catch(e) { alert("Fout bij syncen."); syncBtn.innerText = "PROBEER OPNIEUW"; syncBtn.disabled = false; }
    });
  </script>
</body>
</html>
