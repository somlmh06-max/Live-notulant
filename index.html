<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCS Notulist Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
        <h1 class="text-2xl font-bold text-blue-900 mb-2">🎙️ RCS Notulist Pro</h1>
        <p id="statusText" class="text-gray-500 mb-6">Systeem gereed</p>

        <div id="timer" class="text-4xl font-mono font-bold text-gray-800 mb-8">00:00:00</div>

        <button id="recordBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95">
            Start Vergadering
        </button>

        <div id="log" class="mt-6 text-left text-xs text-gray-400 max-h-48 overflow-y-auto p-2 border-t"></div>
    </div>

    <script>
    const WEB_APP_URL = "PLAK_HIER_JE_NIEUWE_EXEC_URL"; // <--- VUL DIT IN

    let mediaRecorder;
    let fullTranscript = "";
    let isRecording = false;
    let timerInterval;
    let seconds = 0;

    const recordBtn = document.getElementById('recordBtn');
    const statusText = document.getElementById('statusText');
    const timerDisplay = document.getElementById('timer');
    const log = document.getElementById('log');

    function addLog(msg, color = "text-gray-400") {
        const entry = document.createElement('div');
        entry.className = `py-1 border-b border-gray-50 ${color}`;
        entry.textContent = `${new Date().toLocaleTimeString()} - ${msg}`;
        log.prepend(entry);
    }

    // Verbeterde functie om met Google te praten
    async function callGAS(action, payload) {
        const body = JSON.stringify({ action: action, ...payload });
        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'cors', // We dwingen CORS af
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // GAS vindt text/plain vaak fijner
                body: body
            });
            const result = await response.json();
            return result.data;
        } catch (err) {
            console.error("GAS Error:", err);
            return null;
        }
    }

    recordBtn.onclick = async () => {
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = async (event) => {
                    if (event.data.size > 0) {
                        const reader = new FileReader();
                        reader.readAsDataURL(event.data);
                        reader.onloadend = async () => {
                            const base64 = reader.result.split(',')[1];
                            addLog("Segment verzenden...");
                            
                            const text = await callGAS("processAudio", { base64: base64 });
                            
                            if (text && text.trim() !== "") {
                                fullTranscript += text + " ";
                                addLog("AI Herkende tekst: " + text.substring(0, 30) + "...", "text-green-600");
                            } else {
                                addLog("Geen spraak herkend in dit blokje.");
                            }
                        };
                    }
                };

                mediaRecorder.start(10000); // Elke 10 seconden
                isRecording = true;
                recordBtn.textContent = "Stop & Genereer Notulen";
                recordBtn.classList.replace('bg-blue-700', 'bg-red-600');
                statusText.textContent = "Systeem luistert...";
                
                timerInterval = setInterval(() => {
                    seconds++;
                    const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
                    const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                    const s = (seconds % 60).toString().padStart(2, '0');
                    timerDisplay.textContent = `${h}:${m}:${s}`;
                }, 1000);

            } catch (err) {
                alert("Microfoon fout: " + err.message);
            }
        } else {
            stopRecording();
        }
    };

    async function stopRecording() {
        isRecording = false;
        clearInterval(timerInterval);
        mediaRecorder.stop();
        
        recordBtn.disabled = true;
        recordBtn.textContent = "Verwerken...";
        statusText.textContent = "Transcript wordt definitief opgeslagen...";

        // Wacht heel even zodat het laatste audio-segment verwerkt kan worden
        setTimeout(async () => {
            addLog("Eindrapport maken met transcript lengte: " + fullTranscript.length);
            const result = await callGAS("finalize", { transcript: fullTranscript });
            if (result) {
                statusText.textContent = "Klaar! Documenten staan in Drive.";
                addLog("Succes! Link: " + result.url, "text-blue-600");
                window.location.href = result.url;
            } else {
                addLog("FOUT: Kon niet opslaan. Is het transcript leeg?", "text-red-600");
            }
        }, 2000);
    }
</script>
</body>
</html>
