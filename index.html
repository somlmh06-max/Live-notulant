<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCS V15.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-6 font-sans">

    <div class="max-w-md mx-auto">
        <h1 class="text-blue-500 font-black text-center text-2xl mb-12">RCS NOTULIST PRO</h1>
        
        <input type="file" id="audioIn" accept="audio/*" capture="microphone" class="hidden">
        
        <label for="audioIn" id="btn" class="w-48 h-48 bg-red-600 rounded-full mx-auto flex items-center justify-center text-center p-4 shadow-2xl cursor-pointer">
            <span class="font-bold">START OPNAME</span>
        </label>

        <div id="loader" class="hidden fixed inset-0 bg-black/90 flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
            <p>AI aan het werk...</p>
        </div>

        <div id="success" class="hidden fixed inset-0 bg-zinc-950 p-8 flex flex-col justify-center">
            <div class="bg-white text-black p-6 rounded-3xl">
                <h2 class="text-2xl font-bold text-green-600 mb-4">Klaar!</h2>
                
                <a id="docBtn" href="#" target="_blank" class="block w-full bg-blue-600 text-white py-3 rounded-xl text-center font-bold mb-6">📄 OPEN GOOGLE DOC</a>
                
                <div id="taskArea" class="hidden">
                    <p class="text-xs font-bold text-gray-400 uppercase mb-2">Selecteer taken voor Google Tasks:</p>
                    <div id="taskList" class="space-y-3 mb-6 max-h-48 overflow-y-auto"></div>
                    <button id="syncBtn" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">ZET IN GOOGLE TASKS</button>
                </div>
                
                <button onclick="location.reload()" class="w-full mt-4 text-gray-400 text-xs">SLUITEN</button>
            </div>
        </div>
    </div>

    <script>
        // VUL HIER JOUW APPS SCRIPT URL IN !!!
        const URL = "https://script.google.com/macros/s/AKfycbzKXr37Hjj9z3vkJsi9x89caX1QVfaT60NeRgyu9hbHxTIQDmmJTIWkOmqYXk7JQW_wvQ/exec"; 
        let currentDoc = "";

        // Als er een opname wordt gemaakt
        document.getElementById('audioIn').onchange = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            document.getElementById('loader').classList.remove('hidden');
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = async () => {
                const res = await fetch(URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ base64: reader.result.split(',')[1], mimeType: file.type })
                });
                showResult(await res.json());
            };
        };

        // Verwerk het antwoord van de AI
        function showResult(res) {
            document.getElementById('loader').classList.add('hidden');
            if(res.status === "success") {
                currentDoc = res.docUrl;
                document.getElementById('docBtn').href = currentDoc;
                document.getElementById('success').classList.remove('hidden');
                
                // Bouw de lijst met vinkjes als er taken zijn
                if(res.tasks && res.tasks.length > 0) {
                    document.getElementById('taskArea').classList.remove('hidden');
                    const list = document.getElementById('taskList');
                    list.innerHTML = "";
                    res.tasks.forEach((t, i) => {
                        list.innerHTML += `
                            <label class="flex items-start gap-3 p-2 bg-gray-50 rounded-lg">
                                <input type="checkbox" value="${t}" class="task-cb mt-1 w-5 h-5">
                                <span class="text-sm">${t}</span>
                            </label>`;
                    });
                }
            } else { 
                alert("AI is druk. De audio is opgeslagen in je Google Drive. Controleer je mail morgenvroeg!"); 
            }
        }

        // De "ZET IN GOOGLE TASKS" knop
        document.getElementById('syncBtn').onclick = async () => {
            const selected = Array.from(document.querySelectorAll('.task-cb:checked')).map(cb => cb.value);
            if(selected.length === 0) return alert("Selecteer eerst taken!");
            
            const btn = document.getElementById('syncBtn');
            btn.innerText = "BEZIG...";
            btn.disabled = true;
            
            await fetch(URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: "syncTasks", tasks: selected, docUrl: currentDoc })
            });
            
            btn.innerText = "✓ OVERGEZET";
            btn.classList.replace('bg-green-600', 'bg-gray-400');
        };
    </script>
</body>
</html>
